name: Check the source code

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# 検証しかしないため書き込み権限を持たせない。
permissions:
  contents: read

jobs:
  # ジョブ名はルールセットの required_status_checks が参照する context と一致させる。
  # 名前を変えると保護が空振りし、チェックを通さずにマージできてしまう。
  check:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 検証しかしないためトークンをgit configへ残さない。テストやビルドの
          # 実行中に混入したコードが、この認証情報を使えないようにする。
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # pyproject.toml の requires-python の下限。上のバージョンでしか通らない
          # コードが混ざらないよう、下限で検証する。
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-ci.txt

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Check documentation links
        run: python tools/check_doc_links.py

      # ファイル名は plugin_key になるため、メジャー以外が混ざると更新時に
      # 利用者のプリセット参照が外れる（docs/adr/0003）。名前そのものを検証する。
      - name: Build wheel
        run: |
          uv build --wheel
          major="$(sed -n 's/^__wheel_version__ = "\(.*\)"$/\1/p' src/orcaslicer_hole_reinforcement/version.py)"
          expected="dist/orcaslicer_hole_reinforcement-${major}-py3-none-any.whl"
          test -f "$expected" || {
            echo "期待するwheelがありません: $expected" >&2
            ls -l dist >&2
            exit 1
          }
