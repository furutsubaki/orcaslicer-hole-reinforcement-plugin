[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "orcaslicer-hole-reinforcement"
dynamic = ["version"]
description = "OrcaSlicer plugin for reinforcing material around holes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "furutsubaki" },
]
dependencies = ["numpy"]

# wheelのバージョンはメジャーだけ。OrcaSlicerはインストール元wheelのstemをplugin_keyに
# するため、ここが動くと別プラグイン扱いになり、プリセットのplugins参照が外れて
# スライスがブロックされる。実バージョン（__version__）はversion.pyが別に持つ。
# 判断の経緯はdocs/adr/0003-fix-wheel-version-for-stable-plugin-key.mdを参照。
[tool.hatch.version]
path = "src/orcaslicer_hole_reinforcement/version.py"
pattern = '^__wheel_version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/orcaslicer_hole_reinforcement"]

[tool.hatch.build.targets.sdist]
exclude = [
  # ディレクトリは削除済みだが、.gitignoreに載っていないため保護はここだけ。
  # ローカル作業で復活したときに配布物へ混入させない。
  "/.scratch",
  "/test-models",
]
